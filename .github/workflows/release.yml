# Compile et publie l'APK signé sur GitHub Releases à chaque tag « vX.Y.Z ».
#
# Prérequis (une seule fois) : dans ton dépôt GitHub → Settings → Secrets and variables → Actions,
# crée 4 secrets :
#   KEYSTORE_BASE64  : contenu de keystore/mangatheque-release.jks encodé en base64
#                      (PowerShell : [Convert]::ToBase64String([IO.File]::ReadAllBytes("keystore\mangatheque-release.jks")) | Set-Clipboard)
#   KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD : les valeurs de keystore/keystore.properties
#
# Ensuite :  git tag v1.0.1 && git push origin v1.0.1   → l'APK apparaît dans Releases.
name: Publier l'APK

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Restaurer la clé de signature
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/mangatheque-release.jks
          cat > keystore/keystore.properties <<EOF
          storeFile=mangatheque-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Neutraliser le chemin JDK local
        run: sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Compiler l'APK release
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "mangatheque-${GITHUB_REF_NAME}.apk"

      - name: Créer la Release avec l'APK
        uses: softprops/action-gh-release@v2
        with:
          files: mangatheque-*.apk
          generate_release_notes: true
